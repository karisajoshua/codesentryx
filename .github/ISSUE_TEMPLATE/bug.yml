name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Provide minimal steps or a synthetic fixture.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Node, pnpm, OS, and CodeSentryX version/commit.
