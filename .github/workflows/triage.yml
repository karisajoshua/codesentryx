name: Issue Triage

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const text = `${context.payload.issue.title}\n${context.payload.issue.body || ''}`.toLowerCase()
            const labels = []
            if (/rule|detect|scanner|security/.test(text)) labels.push('help wanted')
            if (/documentation|docs|readme/.test(text)) labels.push('documentation')
            if (labels.length) {
              try {
                await github.rest.issues.addLabels({
                  ...context.repo,
                  issue_number: context.issue.number,
                  labels
                })
              } catch (error) {
                core.warning(`Could not apply suggested labels: ${error.message}`)
              }
            }
