name: Welcome Contributors

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const author = context.payload.pull_request.user.login
            const { data } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:pr author:${author}`
            })
            if (data.total_count !== 1) return
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.issue.number,
              body: `Welcome @${author}, and thanks for your first CodeSentryX pull request. Please make sure the PR is focused, tests are included where appropriate, and no real credentials or private source are present in fixtures.`
            })
